   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(37.174909 91.336356)">Vehicle and city state</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(37.174909 102.911356)">Reward and outcome</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 600; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25344a" x="188.930618" y="73.586494" transform="rotate(-0 188.930618 73.586494)">Observation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(188.930618 92.111356)">Lidar and distances</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(188.930618 102.911356)">Balances and clock</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 600; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25344a" x="343.973455" y="73.586494" transform="rotate(-0 343.973455 73.586494)">Hybrid actor</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(343.973455 91.336356)">Categorical intention</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(343.973455 102.136356)">Gaussian driving style</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 600; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25344a" x="485.319927" y="73.586494" transform="rotate(-0 485.319927 73.586494)">Route controller</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(485.319927 91.336356)">Steering and acceleration</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(485.319927 102.136356)">Up to 128 ticks per decision</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 600; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25344a" x="485.319927" y="154.528894" transform="rotate(-0 485.319927 154.528894)">Experience</text>
   </g>
