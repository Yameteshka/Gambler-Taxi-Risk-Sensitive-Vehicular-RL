    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(485.319927 173.053756)">64 lanes × 8 decisions</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #526174" transform="translate(485.319927 183.078756)">Discounted by duration</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 600; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25344a" x="343.973455" y="154.528112" transform="rotate(-0 343.973455 154.528112)">Learner</text>
   </g>
